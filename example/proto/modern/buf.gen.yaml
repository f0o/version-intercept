version: v2
managed:
  enabled: true
  # The modern (2.1) snapshot is the current contract: it is what an up-to-date
  # client generates AND what the example servers implement. The imported
  # versionintercept annotations must keep the LIBRARY's package path so a server
  # that also links the library links a single copy of the annotations (importing
  # two copies of the same proto file panics the protobuf registry at init).
  override:
    - file_option: go_package_prefix
      value: go.f0o.dev/version-intercept/example/gen-modern
    - file_option: go_package
      path: versionintercept/annotations/v1/annotations.proto
      value: go.f0o.dev/version-intercept/gen/versionintercept/annotations/v1
plugins:
  - remote: buf.build/protocolbuffers/go
    out: ../../gen-modern
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.2
    out: ../../gen-modern
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: ../../gen-modern
    opt: paths=source_relative

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - gofmt
    - goimports
    - unconvert
    - gocritic

issues:
  exclude-rules:
    # Generated protobuf/connect code is not subject to our lint rules.
    - path: (gen/|example/gen-legacy/|example/gen-modern/)
      linters:
        - revive
        - staticcheck
        - gocritic
        - misspell

  max-issues-per-linter: 0
  max-same-issues: 0
